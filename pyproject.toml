[project]
name = "oritatami"
version = "0.2.3"
description = "Local protein structure playground: Boltz-2 prediction, ESM-2 scoring and a Qwen assistant in one Mac app"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "RTCK" }]
dependencies = [
    "boltz-community>=2.10.12",
    "torch>=2.6",
    "transformers>=4.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pywebview>=5.0",
    "gemmi>=0.7",
    "rdkit>=2024.3",
    "biopython>=1.84",
    "pyyaml>=6.0",
    "numpy>=1.26",
    # Inverse folding, used as a third opinion on mutation proposals. The -mps fork
    # bundles the weights and picks the Metal backend on Apple Silicon.
    "proteinmpnn-mps>=1.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
oritatami = "oritatami.desktop:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
