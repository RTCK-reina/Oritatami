<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Oritatami Viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
      #viewer { width: 100%; height: 100%; position: relative; }
      #overlay {
        position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: center; color: #8b949e; font-family: system-ui, sans-serif;
        font-size: 14px; pointer-events: none; flex-direction: column; gap: 8px;
      }
      #overlay svg { opacity: .4; }
      #hover-label {
        position: absolute; bottom: 12px; left: 12px; background: rgba(13,17,23,.85);
        border: 1px solid #29313d; border-radius: 6px; padding: 4px 10px;
        color: #e6edf3; font-family: system-ui, sans-serif; font-size: 12px;
        pointer-events: none; display: none;
      }
    </style>
  </head>
  <body>
    <div id="viewer">
      <div id="overlay">
        <svg viewBox="0 0 32 32" width="40" height="40"><path d="M4 23 Q9 5 16 16 T28 9" stroke="#58d5c9" stroke-width="3.4" fill="none" stroke-linecap="round" /></svg>
        <span>構造を読み込むと表示されます</span>
      </div>
      <div id="hover-label"></div>
    </div>
    <script type="module" src="/src/viewer-standalone.ts"></script>
  </body>
</html>
