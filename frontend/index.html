<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oritatami</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 22 Q9 6 16 16 T27 10' stroke='%2358d5c9' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // apply the saved theme before first paint (avoids a dark/light flash)
      try {
        var pref = JSON.parse(localStorage.getItem('oritatami.theme') || '"system"');
        var light = pref === 'light' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
